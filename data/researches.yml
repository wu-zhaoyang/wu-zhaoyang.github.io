        thumbnail: "/images/researches/multimodal-pickup-result.png"
        thumbnail_alt: "多模态远距离拾音增强效果对比"
        description:
          - "针对音视频通话、录像等场景，基于真实手机三麦克原始输入信息："
          - "1) 室内拍摄演讲人场景，存在着混响、噪声、干扰等，提升目标人声的清晰度；"
          - "2) 室外远距离录像场景，存在环境噪声、风声等，对视频内特定人语音进行增强，可懂度提升。"
